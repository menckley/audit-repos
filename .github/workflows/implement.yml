name: 🛠️ Développeur

on:
  # Dès que tu coches « Lancer », « Plus tard » ou « Refuser » dans une issue de ce repo.
  issues:
    types: [edited, labeled]
  # Toutes les heures : tâches automatiques, merges après CI verte, Dependabot,
  # surveillance après merge, repo privé audit-securite, reprises après quota.
  schedule:
    - cron: "15 * * * *"
  # Aussi lancé par lui-même tant qu'il reste du travail (les passages planifiés de GitHub
  # ne sont pas fiables).
  workflow_dispatch:
    inputs:
      chain:
        description: "Réservé : numéro de relance automatique (laisser vide)"
        required: false
        default: ""

permissions:
  contents: write   # enregistrer l'état de l'agent dans state/
  issues: write     # publier le bilan (envoyé par e-mail par GitHub)
  actions: write    # se relancer et lancer l'audit mensuel s'il n'a pas démarré

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  developpeur:
    # Une modification d'issue ne déclenche l'agent que si c'est toi qui as coché une case.
    if: >-
      github.event_name != 'issues' ||
      (github.event.sender.login == github.repository_owner && (
        github.event.label.name == 'approuvé' ||
        contains(github.event.issue.body, '- [x] ✅ **Lancer**') ||
        contains(github.event.issue.body, '- [X] ✅ **Lancer**') ||
        contains(github.event.issue.body, '- [x] ❌ **Refuser**') ||
        contains(github.event.issue.body, '- [X] ❌ **Refuser**') ||
        contains(github.event.issue.body, '- [x] ⏸ **Plus tard**') ||
        contains(github.event.issue.body, '- [X] ⏸ **Plus tard**')))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet ruff pytest

      - name: Coder, merger, surveiller
        working-directory: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_CHAIN: ${{ inputs.chain }}
        run: python implement.py
