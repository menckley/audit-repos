name: Agent

on:
  # Dès que tu coches « Lancer » ou « Refuser » dans une issue de ce repo.
  issues:
    types: [edited, labeled]
  # Toutes les heures : tâches automatiques, merges après CI verte, Dependabot,
  # surveillance après merge, repo privé audit-securite, reprises après quota.
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # enregistrer l'état de l'agent dans state/
  issues: write     # publier le bilan (envoyé par e-mail par GitHub)

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    # Une modification d'issue ne déclenche l'agent que si c'est toi qui as coché une case.
    if: >-
      github.event_name != 'issues' ||
      (github.event.sender.login == github.repository_owner && (
        github.event.label.name == 'approuvé' ||
        contains(github.event.issue.body, '- [x] ✅ **Lancer**') ||
        contains(github.event.issue.body, '- [X] ✅ **Lancer**') ||
        contains(github.event.issue.body, '- [x] ❌ **Refuser**') ||
        contains(github.event.issue.body, '- [X] ❌ **Refuser**')))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet ruff pytest

      - name: Faire avancer le travail
        working-directory: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python implement.py
